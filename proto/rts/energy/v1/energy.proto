syntax = "proto3";

package rts.energy.v1;

option go_package = "github.com/dakotaknutson/unit-strategy-game/gen/rts/energy/v1;energyv1";

// Command payloads owned by the energy plugin. Wrap them in
// google.protobuf.Any in rts.v1.SubmitCommandRequest (players) or
// rts.v1.SubmitAdminCommandRequest (admins).
//
// Energy quantities are integers in abstract energy units. Every command is
// atomic: if any part is invalid, nothing changes.

// MineCommand gives each listed unit a persistent order to extract energy
// from a well. A unit extracts only while it is adjacent to the well
// (including diagonally); otherwise the order waits. The order ends when
// the well is depleted or removed, or on StopMiningCommand.
message MineCommand {
  repeated uint64 unit_ids = 1;
  uint64 well_id = 2;
}

// StopMiningCommand cancels the mining orders of the listed units.
message StopMiningCommand {
  repeated uint64 unit_ids = 1;
}

// TransferCommand gives the sender a persistent order to move `amount`
// energy to an adjacent unit with the same owner, at most the configured
// transfer rate per tick. It replaces the sender's previous transfer order.
// The order ends when the amount has been moved, the sender is empty, the
// receiver is full, or the units are no longer adjacent.
message TransferCommand {
  uint64 from_unit_id = 1;
  uint64 to_unit_id = 2;
  int64 amount = 3;
}

// SetUnitEnergyCommand (admin only) sets a unit's stored energy and,
// optionally, its capacity. Requires 0 <= energy <= capacity.
message SetUnitEnergyCommand {
  uint64 unit_id = 1;
  int64 energy = 2;
  optional int64 capacity = 3;
}
