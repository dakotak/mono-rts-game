syntax = "proto3";

package rts.v1;

option go_package = "github.com/dakotaknutson/unit-strategy-game/gen/rts/v1;rtsv1";

// Shared types used by both the player-facing GameService and the
// privileged AdminService.
//
// Versioning: fields are only ever added. Plugin-specific data travels in
// generic containers (google.protobuf.Any for commands, attribute maps and
// typed event names for observations) so that new mechanics do not require
// changes to these core messages.

// Position is a tile coordinate on the world grid. (0,0) is the top-left tile.
message Position {
  int32 x = 1;
  int32 y = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_UNIT = 1;
  ENTITY_KIND_RESOURCE = 2;
  ENTITY_KIND_TERRAIN = 3;
}

// Value is a plugin-defined attribute or event field value.
message Value {
  oneof kind {
    int64 int_value = 1;
    bool bool_value = 2;
    string string_value = 3;
    Position position_value = 4;
    // An estimate: the true value lies in [low, high]. Sensors disclose
    // estimates of foreign entities at lower identification levels.
    Range range_value = 5;
  }
}

message Range {
  int64 low = 1;
  int64 high = 2;
}

// How much a player knows about an entity. Own entities are OWN; foreign
// entities carry the level their sensors achieved.
enum IdentificationLevel {
  IDENTIFICATION_LEVEL_UNSPECIFIED = 0;
  // Position, owner and kind only (plus anything rules disclose at basic).
  IDENTIFICATION_LEVEL_BASIC = 1;
  // Approximate values for permitted attributes.
  IDENTIFICATION_LEVEL_ESTIMATED = 2;
  // Exact values for permitted attributes.
  IDENTIFICATION_LEVEL_DETAILED = 3;
  // The player's own entity: everything.
  IDENTIFICATION_LEVEL_OWN = 4;
}

// Entity is an observation of a single entity. Which attributes are present
// depends on what the observer is authorized to see.
message Entity {
  // Opaque, unpredictable identifier. IDs carry no information about how
  // many entities exist or the order they were created in; do not assume
  // they are small, dense or increasing.
  uint64 id = 1;
  EntityKind kind = 2;
  // Owning player (an opaque ID like player_id), or 0 for unowned entities.
  uint32 owner_id = 3;
  Position position = 4;
  // Plugin-defined attributes keyed by "<plugin>.<name>", e.g.
  // "movement.destination".
  map<string, Value> attributes = 5;
  // Passable entities (e.g. wreckage) do not block their tile; units can
  // stand on them and several may share a tile.
  bool passable = 6;
  // Set when fog of war is on: OWN for the player's own entities, the
  // sensor identification level for foreign ones. Under fog of war, a
  // foreign entity's attributes are exactly what disclosure rules allow at
  // that level; nothing else is sent.
  IdentificationLevel identification = 7;
}

// TileRun is a horizontal run of tiles: (x .. x+length-1, y).
message TileRun {
  int32 y = 1;
  int32 x = 2;
  int32 length = 3;
}

// Event is a plugin-defined occurrence during a tick, e.g. "movement.arrived".
message Event {
  string type = 1;
  // Primary entity the event concerns, or 0.
  uint64 entity_id = 2;
  map<string, Value> fields = 3;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_SUCCEEDED = 1;
  COMMAND_STATUS_FAILED = 2;
  // Some units succeeded and some failed (batch commands); see
  // CommandResult.unit_results.
  COMMAND_STATUS_PARTIAL = 3;
}

// CommandResult reports the outcome of executing a previously accepted
// command. Acceptance (see SubmitCommandResponse) and execution are separate.
message CommandResult {
  string command_id = 1;
  // Tick in which the command executed.
  uint64 tick = 2;
  CommandStatus status = 3;
  // Machine-readable failure code, e.g. "permission_denied", "not_found",
  // "invalid_argument". Empty on success.
  string error_code = 4;
  string error_message = 5;
  // Per-unit outcomes for commands that report them (batch commands), in
  // ascending unit ID order.
  repeated UnitResult unit_results = 6;
}

message UnitResult {
  uint64 unit_id = 1;
  bool ok = 2;
  string error_code = 3;
  string error_message = 4;
}

message WorldInfo {
  // Field 4 (a list of all players) was removed: it disclosed the number of
  // players. Players learn about others only through what they observe.
  reserved 4;
  reserved "players";

  int32 width = 1;
  int32 height = 2;
  uint32 tick_rate_hz = 3;
  // Fully-qualified protobuf message names accepted as command payloads.
  repeated string command_types = 5;
  // Registered plugins, in initialization order.
  repeated string plugins = 6;
  // JSON object keyed by plugin name with each plugin's published rules:
  // effective configuration, formulas, and tables (e.g. attribute upgrade
  // cost/duration tables). Rules are public game information.
  string rules_json = 7;
  // Per-tick execution order, one "phase: system, ..." entry per phase.
  repeated string schedule = 8;
  // Maximum unit-commands per player per tick (0 = unlimited).
  uint32 unit_command_budget = 9;
}

message PlayerInfo {
  uint32 id = 1;
  string name = 2;
}

// WorldSnapshot is a complete, consistent view of the world at a tick, as
// visible to the requester.
message WorldSnapshot {
  uint64 tick = 1;
  // Sorted by entity id. Under fog of war: the player's own entities and
  // the foreign entities they currently detect.
  repeated Entity entities = 2;
  // Whether fog of war is on. When false, everything is visible and
  // visible_tiles is empty.
  bool fog_of_war = 3;
  // Tiles currently visible to the player (fog of war only).
  repeated TileRun visible_tiles = 4;
}

// TickUpdate is the batched set of changes produced by one simulation tick,
// as visible to the requester. Applying it to the snapshot of tick-1 yields
// the snapshot of tick.
message TickUpdate {
  uint64 tick = 1;
  // Entities that were created, changed or became observable this tick
  // (full replacement of what the client holds).
  repeated Entity changed = 2;
  // Entities the player no longer observes. Under fog of war this does not
  // say why: a foreign entity may have left detection or been destroyed.
  // Clients should keep a stale "last known" copy of foreign entities.
  repeated uint64 removed = 3;
  repeated Event events = 4;
  // Results for the requester's own commands executed this tick.
  repeated CommandResult command_results = 5;
  // Tiles that became visible / stopped being visible this tick (fog of
  // war only), sorted by row then column.
  repeated Position tiles_entered = 6;
  repeated Position tiles_exited = 7;
}
